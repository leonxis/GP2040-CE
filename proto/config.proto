// Right stick Y overlay only; rightYActivePreset: 0=clear (no offset), 1-3=preset percents
message AxisTiltOverlayOptions
{
    optional uint32 rightYTriggerButtonMask = 3 [default = 0];
    optional float rightYPercent1 = 6 [default = 0.0];
    optional float rightYPercent2 = 7 [default = 0.0];
    optional uint32 rightYActivePreset = 9 [default = 0];
    optional float rightYPercent3 = 10 [default = 0.0];
    optional bool pressEnabled = 11 [default = false];
    optional bool rcGainEnabled = 12 [default = false];
    optional uint32 rcGainTriggerButtonMask = 13 [default = 0];
    // RC params:
    // rcGainReserved1: jitter strength percent (0..100)
    // rcGainReserved2: circular jitter radius percent (0..100), independent of decay
    // rcGainReserved3: radial decay end percent (0..100 from wire; <=3 no decay; >3 linear Linf from 3% to this end)
    optional float rcGainReserved1 = 14 [default = 0.0];
    optional float rcGainReserved2 = 15 [default = 0.0];
    optional float rcGainReserved3 = 16 [default = 3.0];
    optional bool rcGainAlwaysOn = 17 [default = false];

    reserved 18;
}

