    optional uint32 customThemeB3Pressed = 33;
    optional uint32 customThemeB4Pressed = 34;
    optional uint32 customThemeL1Pressed = 35;
    optional uint32 customThemeR1Pressed = 36;
    optional uint32 customThemeL2Pressed = 37;
