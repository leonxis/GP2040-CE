message BootselButtonOptions
{
    optional bool enabled = 1;
    optional uint32 buttonMap = 2;
}

message CurvePoint
{
    optional float x = 1;
    optional float y = 2;
    reserved 3;
}

message CurvePreset
{
    optional string name = 1 [(nanopb).max_length = 64];
    repeated CurvePoint points = 2 [(nanopb).max_count = 6];
    optional uint32 activationButtonMask = 3 [default = 0];  // Button mask to activate this preset (0 = NONE, disabled)
}

message AnalogOptions
{
    optional bool enabled = 1;

    optional int32 analogAdc1PinX = 2;
    optional int32 analogAdc1PinY = 3;
    optional bool forced_circularity = 4;
    optional uint32 inner_deadzone = 5;
    optional int32 analogAdc2PinX = 6;
    optional int32 analogAdc2PinY = 7;
    optional DpadMode analogAdc1Mode = 8;
    optional DpadMode analogAdc2Mode = 9;
    optional InvertMode analogAdc1Invert = 10;
    optional InvertMode analogAdc2Invert = 11;
    optional uint32 outer_deadzone = 13;
    // EMA smoothing removed - no longer used (fields 14, 15, 17, 18)
    optional uint32 analog_error = 16;
    optional uint32 analog_error2 = 19;
    optional uint32 inner_deadzone2 = 20;
    optional uint32 outer_deadzone2 = 21;
    optional bool forced_circularity2 = 23;
    optional uint32 joystick_center_x = 24;
    optional uint32 joystick_center_y = 25;
    optional uint32 joystick_center_x2 = 26;
    optional uint32 joystick_center_y2 = 27;
    optional uint32 anti_deadzone = 28;
    optional uint32 anti_deadzone2 = 29;
    optional float smoothing_alpha_max = 30;
    optional float smoothing_delta_max = 31;
    optional float smoothing_alpha_max2 = 32;
    optional float smoothing_delta_max2 = 33;
    repeated float joystick_range_data_1 = 34 [(nanopb).max_count = 48];
    repeated float joystick_range_data_2 = 35 [(nanopb).max_count = 48];
    // Finetune shape adjustment settings
    optional float joystick_finetune_shape_x_top_percent_1 = 46 [deprecated = true];
    optional float joystick_finetune_shape_x_bottom_percent_1 = 47 [deprecated = true];
    optional float joystick_finetune_shape_y_left_percent_1 = 48 [deprecated = true];
    optional float joystick_finetune_shape_y_right_percent_1 = 49 [deprecated = true];
    optional bool joystick_finetune_shape_force_circular_1 = 50 [default = false];
    optional float joystick_finetune_shape_amplify_1 = 51 [default = 0];
    optional float joystick_finetune_shape_x_top_percent_2 = 52 [deprecated = true];
    optional float joystick_finetune_shape_x_bottom_percent_2 = 53 [deprecated = true];
    optional float joystick_finetune_shape_y_left_percent_2 = 54 [deprecated = true];
    optional float joystick_finetune_shape_y_right_percent_2 = 55 [deprecated = true];
    optional bool joystick_finetune_shape_force_circular_2 = 56 [default = false];
    optional float joystick_finetune_shape_amplify_2 = 57 [default = 0];
    optional uint32 joystick_jitter_filter_1 = 58 [default = 0];
    optional uint32 joystick_jitter_filter_2 = 59 [default = 0];
    // Response curve control points (max 6 points per stick)
    repeated CurvePoint joystick_curve_points_1 = 60 [(nanopb).max_count = 6];
    repeated CurvePoint joystick_curve_points_2 = 61 [(nanopb).max_count = 6];
    optional bool joystick_curve_enabled = 62 [default = false];
    // Fixed anti-deadzone mode (true = fixed, false = linear)
    optional bool fixed_anti_deadzone = 63 [default = false];
    optional bool fixed_anti_deadzone2 = 64 [default = false];
    // Curve preset schemes (max 2 presets)
    repeated CurvePreset joystick_curve_presets = 65 [(nanopb).max_count = 2];
    // Current curve profile in use (0 = custom/no preset, 1-2 = preset 1-2)
    // Used to detect hotkey preset switching for efficient reinitialization
    optional uint32 curve_profile_1 = 66 [default = 0];  // Left stick (stick 1)
    optional uint32 curve_profile_2 = 67 [default = 0];  // Right stick (stick 2)
    // Joystick travel-triggered key mapping
    optional GpioAction joystick_travel_button_action = 68 [default = NONE];
    optional uint32 joystick_travel_button_custom_dpad_mask = 69 [default = 0];
    optional uint32 joystick_travel_button_custom_button_mask = 70 [default = 0];
    optional uint32 joystick_travel_button_threshold = 71 [default = 0];
    optional GpioAction joystick_travel_button_action2 = 72 [default = NONE];
    optional uint32 joystick_travel_button_custom_dpad_mask2 = 73 [default = 0];
    optional uint32 joystick_travel_button_custom_button_mask2 = 74 [default = 0];
    optional uint32 joystick_travel_button_threshold2 = 75 [default = 0];
}

