; PlatformIO 配置——仅用于本机编译验证（生产用 Arduino IDE 编译）
; ESP32-S3 DevModule, Arduino-ESP32 2.0.17 (espressif32@7.1.7)
; NimBLE-Arduino >= 2.3.3（2.1.2 在 core 3.x 下 VHCI crash，已废弃）
;   库安装在 ~/.platformio/libdeps/esp32s3/ 下
; 注意：3.x 会使 NimBLE 在初始化阶段崩溃（VHCI API 已删除），
;   如需 3.x 编译需升级到 NimBLE >= 2.5.1
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@7.1.7
board = esp32s3dev
framework = arduino
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_ldf_mode = deep+
lib_deps =
  h2zero/NimBLE-Arduino@^2.3.3
  tomsolomon/Callback@^2.1.0
upload_protocol = esptool
